<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6C4FD1" />
<title>חשבון קסם</title>
<style>
  :root {
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Helvetica Neue", sans-serif;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(180deg, #6c4fd1 0%, #b892e8 100%);
  }
  .card {
    background: #ffffff;
    border-radius: 28px;
    padding: 40px 28px;
    text-align: center;
    width: min(90vw, 380px);
    box-shadow: 0 20px 50px rgba(40, 20, 90, 0.35);
  }
  .sparkle { font-size: 48px; }
  .title { font-size: 26px; margin: 8px 0 4px; color: #3a2a63; }
  .subtitle { color: #6d5a99; margin: 0 0 24px; font-size: 15px; }
  /* Plain link styled as a button — no script involved, so it works
     even inside a restricted preview (e.g. an AirDrop/Messages Quick
     Look) that won't run JavaScript. Tapping it navigates for real,
     which hands off to full Safari where the game loads normally. */
  .play-btn {
    display: block;
    text-decoration: none;
    border: none; border-radius: 999px;
    background: linear-gradient(90deg, #ff6b9d, #ff9f43);
    color: #fff; font-size: 19px; font-weight: 800;
    padding: 16px 28px; min-height: 56px;
    line-height: 24px;
  }
  .play-btn:active { transform: scale(0.97); }
  .hint { color: #9a8cc4; margin: 16px 0 0; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="sparkle" aria-hidden="true">✨</div>
    <h1 class="title">חשבון קסם</h1>
    <p class="subtitle">משחק חשבון קסום מחכה לכם!</p>
    <a class="play-btn" href="https://rdwr-valentineg.github.io/magic-math/distribution/magic-math.html">▶ שחקו עכשיו!</a>
    <p class="hint">לחצו כדי להתחיל לשחק</p>
  </div>
</body>
</html>
