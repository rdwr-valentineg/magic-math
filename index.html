<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6C4FD1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="חשבון קסום" />
  <title>חשבון קסום</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">

    <!-- Loading screen -->
    <section id="screen-loading" class="screen screen--active" aria-live="polite">
      <div class="loading-card">
        <div class="loading-sparkle" aria-hidden="true">✨</div>
        <h1 class="loading-title">חשבון קסום</h1>
        <p class="loading-text" id="loading-text">מכינים את העולם הקסום…</p>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="loading-progressbar">
          <div class="progress-fill" id="loading-progress-fill"></div>
        </div>
        <p class="loading-ready" id="loading-ready" hidden>הכול מוכן! ✨</p>
      </div>
    </section>

    <!-- Character selection -->
    <section id="screen-character" class="screen" aria-live="polite">
      <div class="screen-inner">
        <h1 class="screen-title">בחרו חבר קסום</h1>
        <div class="character-grid" id="character-grid"></div>
      </div>
    </section>

    <!-- Settings: number range + operations -->
    <section id="screen-settings" class="screen">
      <div class="screen-inner">
        <div class="settings-character">
          <img id="settings-character-img" class="settings-character-img" alt="" />
          <button type="button" id="btn-change-character" class="link-button">החלפת חבר</button>
        </div>

        <h2 class="section-title">עד איזה מספר?</h2>
        <div class="choice-grid" id="range-grid">
          <button type="button" class="choice-btn" data-range="10">0–10</button>
          <button type="button" class="choice-btn" data-range="20">0–20</button>
          <button type="button" class="choice-btn" data-range="50">0–50</button>
          <button type="button" class="choice-btn" data-range="100">0–100</button>
        </div>

        <h2 class="section-title">אילו תרגילים?</h2>
        <div class="choice-grid" id="operations-grid">
          <button type="button" class="choice-btn choice-btn--op" data-op="add">
            <span class="op-symbol" aria-hidden="true">+</span><span>חיבור</span>
          </button>
          <button type="button" class="choice-btn choice-btn--op" data-op="sub">
            <span class="op-symbol" aria-hidden="true">−</span><span>חיסור</span>
          </button>
          <button type="button" class="choice-btn choice-btn--op" data-op="mul">
            <span class="op-symbol" aria-hidden="true">×</span><span>כפל</span>
          </button>
          <button type="button" class="choice-btn choice-btn--op" data-op="div">
            <span class="op-symbol" aria-hidden="true">÷</span><span>חילוק</span>
          </button>
        </div>

        <button type="button" id="btn-play" class="play-button" disabled>
          <span class="play-icon" aria-hidden="true">▶</span>
          <span>שיחקו!</span>
        </button>
      </div>
    </section>

    <!-- Game screen -->
    <section id="screen-game" class="screen">
      <div class="game-hud">
        <div class="hud-score" id="hud-score" aria-live="polite">
          <span class="hud-score-icon" aria-hidden="true">⭐</span>
          <span id="hud-score-value">0</span>
        </div>
        <div class="progress-stars" id="progress-stars" aria-hidden="true"></div>
      </div>

      <div class="game-character-wrap">
        <img id="game-character-img" class="game-character-img" alt="" />
        <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
        <div class="score-pop" id="score-pop" hidden></div>
      </div>

      <div class="exercise-card">
        <div class="exercise" id="exercise-display" aria-live="polite"></div>
      </div>

      <div class="keypad" id="keypad">
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key--wide" data-key="del">⌫</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key key--confirm" data-key="ok">✓</button>
      </div>
    </section>

    <!-- End screen -->
    <section id="screen-end" class="screen">
      <div class="screen-inner end-inner">
        <img id="end-character-img" class="end-character-img" alt="" />
        <h1 class="end-title">כל הכבוד!</h1>
        <div class="end-stats">
          <div class="end-stat">
            <span class="end-stat-label">ניקוד סופי</span>
            <span class="end-stat-value" id="end-score">0</span>
          </div>
          <div class="end-stat">
            <span class="end-stat-label">תשובות נכונות בניסיון ראשון</span>
            <span class="end-stat-value" id="end-first-attempt">0</span>
          </div>
          <div class="end-stat end-stat--high" id="end-highscore-row">
            <span class="end-stat-label">שיא</span>
            <span class="end-stat-value" id="end-highscore">0</span>
          </div>
        </div>
        <div class="end-actions">
          <button type="button" id="btn-play-again" class="play-button">
            <span class="play-icon" aria-hidden="true">▶</span>
            <span>לשחק שוב</span>
          </button>
          <button type="button" id="btn-change-settings" class="secondary-button">
            <span aria-hidden="true">⚙️</span>
            <span>החלפת חבר / הגדרות</span>
          </button>
        </div>
      </div>
    </section>

  </div>

  <script src="./js/assets-manifest.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/questions.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
