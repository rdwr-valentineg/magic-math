<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>README - משחקי קסם</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css" />
<style>
  body { margin: 0; background: #f6f8fa; }
  .topbar {
    position: sticky; top: 0; z-index: 1;
    background: #24292f; color: #fff;
    padding: 10px 16px; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .topbar a { color: #fff; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  .markdown-body { box-sizing: border-box; }
  .status { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #57606a; }
</style>
</head>
<body>
  <!--
    Static docs mirror of the repo's own README.md, served at the clean
    "/readme" URL. GitHub Pages has no server-side rendering, so this fetches
    the raw README.md (a relative path — works whether the site is served
    at a domain root or under a project sub-path) and renders it client-side
    with marked.js. If that ever fails (offline first load, CDN blocked),
    it falls back to a plain link to the raw file.
  -->
  <div class="topbar"><a href="../remote/">&larr; למשחקים</a></div>
  <div class="wrap">
    <div id="content" class="markdown-body"><p class="status">טוען את ה-README...</p></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
  <script>
    (function () {
      'use strict';
      var el = document.getElementById('content');
      fetch('../README.md', { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('README.md responded ' + res.status);
          return res.text();
        })
        .then(function (markdown) {
          el.innerHTML = window.marked.parse(markdown);
        })
        .catch(function () {
          el.innerHTML = '<p class="status">אי אפשר היה לטעון את ה-README כרגע. ' +
            '<a href="../README.md">פתיחת הקובץ הגולמי</a>.</p>';
        });
    })();
  </script>
</body>
</html>
